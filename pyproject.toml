[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "slowverb"
version = "0.1.0"
description = "YouTube to slowed + reverb MP3. One command."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohin Arya" }]
keywords = ["audio", "cli", "mp3", "reverb", "youtube"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
]
dependencies = ["yt-dlp[default]>=2026.10.26"]

[project.scripts]
slowverb = "slowverb.cli:main"

[project.urls]
Homepage = "https://github.com/r0hin/slowverb"
Issues = "https://github.com/r0hin/slowverb/issues"

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
